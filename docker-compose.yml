services:
  config-server:
    build: ./config
    container_name: config-server
    ports:
      - "8888:8888"

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - user-service
      - message-service
      - file-service

  user-service:
    build: ./user
    container_name: user-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - config-server

  message-service:
    build: ./message
    container_name: message-service
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - config-server

  file-service:
    build: ./file
    container_name: file-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - config-server
