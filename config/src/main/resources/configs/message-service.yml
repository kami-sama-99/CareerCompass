firebase:
  service-account-key-path: /app/config/serviceAccountKey.json
  storage-bucket: career-compass-e2f8b.appspot.com

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}