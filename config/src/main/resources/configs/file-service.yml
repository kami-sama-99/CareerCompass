firebase:
  service-account-key-path: D:/keys/serviceAccountKey.json
  storage-bucket: career-compass-e2f8b.firebasestorage.app

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}