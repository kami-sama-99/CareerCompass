server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: message-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/users/*/mentor_sessions/**

            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/users/**

            - id: file-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/file/**
